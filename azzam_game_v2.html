<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مغامرات سوبر عزام</title>
<style>
:root{--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#wrap{position:relative;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--u)*10) calc(var(--u)*14);pointer-events:none;font-weight:700;font-size:calc(var(--u)*19);text-shadow:0 2px 4px rgba(0,0,0,.6);z-index:3}
.menu #hud{display:none}
.chip{background:rgba(10,14,30,.55);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  padding:calc(var(--u)*4) calc(var(--u)*14);display:flex;gap:calc(var(--u)*10);align-items:center;white-space:nowrap;backdrop-filter:blur(4px)}
.ib{pointer-events:auto;width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05));color:#fff;display:flex;align-items:center;justify-content:center;
  padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,background .15s,color .15s}
.ib svg{width:56%;height:56%;display:block}
.ib:hover{background:linear-gradient(180deg,#ffe27a,#e0a010);color:#3a2300}
.ib:active{transform:scale(.9)}
.ib .x{display:none}.ib.off .w{display:none}.ib.off .x{display:block}
.hf{color:#ff4560;text-shadow:0 0 8px rgba(255,69,96,.7)}
.he{color:rgba(255,255,255,.25)}
.pw{color:#ffd54f}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*14);text-align:center;padding:calc(var(--u)*20);z-index:5;
  background:radial-gradient(ellipse at center,rgba(25,10,45,.3),rgba(10,5,25,.82))}
#overlay.hidden{display:none}
#ovTitle{font-size:calc(var(--u)*62);margin:0;line-height:1.15;color:#ffd24a;
  background:linear-gradient(180deg,#fff6c9,#ffc83a 55%,#e07a10);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,35,0,.85)) drop-shadow(0 8px 16px rgba(0,0,0,.5))}
#ovSub{margin:0;font-size:calc(var(--u)*22);max-width:calc(var(--u)*720);line-height:1.7;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#ovHint{margin:0;font-size:calc(var(--u)*15);opacity:.85;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#ovBtns{display:flex;gap:calc(var(--u)*14);flex-wrap:wrap;justify-content:center}
.btn{font-family:inherit;font-size:calc(var(--u)*24);font-weight:800;color:#fff;border:0;cursor:pointer;position:relative;overflow:hidden;
  padding:calc(var(--u)*11) calc(var(--u)*40);border-radius:calc(var(--u)*16);
  text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .12s,filter .15s}
.btn:hover{transform:translateY(calc(var(--u)*-2));filter:brightness(1.12)}
.btn:active{transform:translateY(calc(var(--u)*3))}
.btn.pri{background:linear-gradient(180deg,#43e892 0%,#0fa352 55%,#0b8541 100%);border:1px solid rgba(255,255,255,.4);
  box-shadow:0 calc(var(--u)*5) 0 #06562b,0 calc(var(--u)*12) calc(var(--u)*22) rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;width:28%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);animation:shine 2.8s infinite}
@keyframes shine{0%{left:-40%}60%,100%{left:140%}}
.btn.sec{font-size:calc(var(--u)*20);padding:calc(var(--u)*10) calc(var(--u)*28);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.45);box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35),0 calc(var(--u)*10) calc(var(--u)*18) rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(6px)}
#nameBox{display:none;flex-direction:column;align-items:center;gap:calc(var(--u)*6)}
#nameBox label{font-size:calc(var(--u)*15);opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#nameIn{font-family:inherit;font-size:calc(var(--u)*22);font-weight:700;text-align:center;color:#fff;width:calc(var(--u)*320);max-width:86vw;
  padding:calc(var(--u)*7) calc(var(--u)*16);border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);
  outline:none;user-select:text;-webkit-user-select:text;touch-action:auto;backdrop-filter:blur(6px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
#nameIn::placeholder{color:rgba(255,255,255,.55);font-weight:500}
#nameIn:focus{border-color:#ffd24a;box-shadow:0 0 0 3px rgba(255,210,74,.35),inset 0 2px 6px rgba(0,0,0,.25)}
.lb{border-collapse:separate;border-spacing:0 calc(var(--u)*5);width:min(calc(var(--u)*580),92vw);margin:0 auto;font-size:calc(var(--u)*19)}
.lb th{opacity:.75;font-size:calc(var(--u)*13);font-weight:600;padding:0 calc(var(--u)*10)}
.lb td{background:rgba(255,255,255,.13);padding:calc(var(--u)*4) calc(var(--u)*10);white-space:nowrap}
.lb td:first-child{border-radius:0 calc(var(--u)*10) calc(var(--u)*10) 0;width:calc(var(--u)*54)}
.lb td:last-child{border-radius:calc(var(--u)*10) 0 0 calc(var(--u)*10);font-weight:800;color:#ffe27a}
.lb td.nm{text-align:right;font-weight:700;max-width:calc(var(--u)*240);overflow:hidden;text-overflow:ellipsis}
.lb tr.me td{background:rgba(255,210,74,.3)}
.lb tr.top td{background:rgba(255,210,74,.18)}
.empty{opacity:.85;font-size:calc(var(--u)*20)}
#lvGrid{display:none;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*9);width:min(calc(var(--u)*820),96%)}
.lv{font-family:inherit;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:calc(var(--u)*14);cursor:pointer;
  padding:calc(var(--u)*7) calc(var(--u)*6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1);position:relative;
  background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);
  text-shadow:0 2px 4px rgba(0,0,0,.7);transition:transform .12s}
.lv:hover{transform:translateY(calc(var(--u)*-3))}
.lv:active{transform:translateY(calc(var(--u)*2))}
.lv .n{font-size:calc(var(--u)*26);font-weight:900;line-height:1.1}
.lv .t{font-size:calc(var(--u)*14);font-weight:700;line-height:1.3}
.lv.lock{filter:grayscale(1) brightness(.55);cursor:not-allowed}
.lv .k{position:absolute;top:calc(var(--u)*4);left:calc(var(--u)*6);font-size:calc(var(--u)*14)}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;direction:ltr;
  padding:14px calc(22px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left));pointer-events:none;z-index:10}
#touch.show{display:flex}
#touch .grp{display:flex;gap:16px;pointer-events:auto}
.tb{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.6);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(255,255,255,.08) 60%,rgba(0,0,0,.15));
  box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.25);backdrop-filter:blur(3px);transition:transform .08s}
.tb svg{width:46%;height:46%;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.tb.on{transform:scale(.92);background:radial-gradient(circle at 35% 30%,rgba(255,236,150,.9),rgba(255,180,40,.6) 65%,rgba(200,110,0,.4));border-color:#fff3b0}
.tb.jmp{width:104px;height:104px;border-color:rgba(120,255,180,.8)}
.tb.fire{border-color:rgba(255,170,80,.9)}
.tb.fire.on{background:radial-gradient(circle at 35% 30%,rgba(255,200,120,.95),rgba(255,120,30,.7) 65%,rgba(180,60,0,.5))}
@media (max-height:430px){.tb{width:66px;height:66px}.tb.jmp{width:82px;height:82px}#touch{padding-top:8px}}
#rotate{display:none;position:fixed;top:6px;left:0;right:0;text-align:center;font-size:14px;opacity:.8;pointer-events:none;z-index:20}
@media (orientation:portrait){body.touch #rotate{display:block}}
</style>

<body>
<div id="stage">
  <div id="wrap" class="menu">
    <canvas id="c" width="960" height="560"></canvas>
    <div id="hud">
      <div class="chip" id="hScore"></div>
      <div class="chip" id="hLevel"></div>
      <div class="chip">
        <span id="hPow"></span>
        <span id="hHearts"></span>
        <button class="ib" id="bSnd" tabindex="-1" title="الصوت"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="w" d="M16 8.5a5 5 0 010 7M18.6 6a8.6 8.6 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
        <button class="ib" id="bFs" tabindex="-1" title="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="ib" id="bPause" tabindex="-1" title="إيقاف مؤقت"><svg viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div id="overlay">
      <h1 id="ovTitle"></h1>
      <p id="ovSub"></p>
      <div id="nameBox"><label for="nameIn">اسم اللاعب</label><input id="nameIn" type="text" maxlength="14" autocomplete="off" spellcheck="false" placeholder="اكتب اسمك هنا"></div>
      <div id="lvGrid"></div>
      <div id="ovBtns"></div>
      <p id="ovHint"></p>
    </div>
  </div>
</div>
<div id="rotate">📱 للحصول على تجربة أفضل أدر الجهاز بشكل أفقي</div>
<div id="touch">
  <div class="grp">
    <button class="tb" data-k="left" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="tb" data-k="right" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="grp"><button class="tb fire" data-k="fire" tabindex="-1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button><button class="tb jmp" data-k="jump" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7M5 20l7-7 7 7"/></svg></button></div>
</div>

<script>
(function(){
'use strict';
/* ============================================================
   مغامرات سوبر عزام — لعبة منصات 2D (ملف واحد بدون اتصال)
   كل شيء مرسوم برمجياً (Canvas) ومصنوع صوتياً (Web Audio)
   ============================================================ */
const H=560,T=40,GR=12;                 // الارتفاع، حجم البلاطة، صف الأرض
let W=960;                              // العرض يتغير حسب الشاشة (ملء الشاشة)
const UNLOCK_ALL=true;                  // اجعلها false لتفعيل فتح المراحل تدريجياً
const FONT='"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d'), wrap=$('wrap');
const nameIn=$('nameIn'), nameBox=$('nameBox');
const ov=$('overlay'), ovTitle=$('ovTitle'), ovSub=$('ovSub'), ovBtns=$('ovBtns'), ovHint=$('ovHint'), lvGrid=$('lvGrid');
const hScore=$('hScore'), hLevel=$('hLevel'), hHearts=$('hHearts'), hPow=$('hPow');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const nf=n=>{try{return n.toLocaleString('ar-EG');}catch(e){return String(n);}};

/* ---------------- الصوتيات ---------------- */
let AC=null, master=null, musGain=null, muted=false;
let musTheme=null, musNext=0, musStep=0, amb=null, ambTheme=null;
function initAudio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
      musGain=AC.createGain();musGain.gain.value=.16;musGain.connect(master);
      musNext=AC.currentTime+.1;
      setInterval(musTick,80);
      setAmb(ambTheme);
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function tone(f0,f1,dur,type,vol,delay,dest){
  if(!AC||muted)return; delay=delay||0;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,delay,fq,type){
  if(!AC||muted)return; delay=delay||0;
  const n=Math.max(1,(AC.sampleRate*dur)|0), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=fq||1200; if(type==='bandpass')f.Q.value=.8;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(AC.currentTime+delay);
}
const SFX={
  jump(){tone(300,760,.18,'square',.14);tone(450,1100,.12,'triangle',.06,.02);},
  coin(k){const m=1+Math.min(k||0,10)*.045;tone(988*m,988*m,.07,'triangle',.26);tone(1319*m,1319*m,.2,'triangle',.26,.07);},
  stomp(){tone(240,70,.16,'square',.22);noise(.09,.25,0,900);tone(520,260,.1,'triangle',.12,.03);},
  zap(){tone(900,160,.22,'sawtooth',.18);noise(.12,.2,0,2400,'highpass');},
  bump(){tone(140,60,.12,'sine',.5);noise(.05,.15,0,500);},
  item(){tone(420,880,.22,'sine',.22);tone(630,1320,.22,'triangle',.1,.05);},
  power(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.13,'square',.15,i*.07));noise(.3,.08,0,3000,'highpass');},
  life(){[392,523,659,784,1047].forEach((f,i)=>tone(f,f,.12,'triangle',.2,i*.06));},
  hurt(){tone(400,120,.25,'sawtooth',.2);noise(.12,.2,0,1500);},
  lose(){[392,370,349,330,294,262].forEach((f,i)=>tone(f,f*.97,.16,'sawtooth',.16,.12+i*.11));},
  win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,f,.18,'square',.15,i*.11));[1047,1319,1568].forEach((f,i)=>tone(f,f,.5,'triangle',.12,.95+i*.02));},
  check(){tone(660,990,.15,'triangle',.25);tone(990,1320,.2,'triangle',.2,.1);},
  step(){noise(.035,.05+Math.random()*.02,0,1800+Math.random()*900,'highpass');},
  land(){tone(120,55,.09,'sine',.35);noise(.06,.12,0,600);},
  splash(){noise(.5,.35,0,1800,'bandpass');[0,.08,.16,.26].forEach(d=>tone(500+Math.random()*500,900+Math.random()*500,.08,'sine',.12,d));},
  fall(){tone(700,90,.55,'sine',.16);},
  tick(){tone(1500,1500,.04,'square',.1);},
  start(){[392,494,587,784].forEach((f,i)=>tone(f,f,.14,'triangle',.18,i*.09));noise(.35,.1,0,2500,'highpass');},
  click(){tone(760,520,.06,'triangle',.2);},
  hover(){tone(1100,1100,.025,'sine',.06);},
  pause(){tone(500,330,.1,'triangle',.18);},
  shoot(){tone(900,320,.12,'square',.12);noise(.05,.12,0,2500,'highpass');},
  djump(){tone(500,1200,.16,'triangle',.18);tone(700,1500,.1,'sine',.08,.03);}
};
function toggleMute(){muted=!muted;$('bSnd').classList.toggle('off',muted);setAmb(ambTheme);}

/* موسيقى بمقام الحجاز — لحن مختلف لكل مرحلة */
const HIJAZ=[0,1,4,5,7,8,10,12];
const MUS={
  menu:{bpm:92,root:50,wave:'triangle',seed:1},dunes:{bpm:100,root:50,wave:'triangle',seed:2},
  diriyah:{bpm:108,root:52,wave:'square',seed:3},jeddah:{bpm:112,root:55,wave:'triangle',seed:4},
  abha:{bpm:96,root:53,wave:'sine',seed:5},ahsa:{bpm:104,root:50,wave:'triangle',seed:6},
  qassim:{bpm:100,root:48,wave:'square',seed:7},north:{bpm:92,root:47,wave:'sawtooth',seed:8},
  tabuk:{bpm:102,root:52,wave:'triangle',seed:10},makkah:{bpm:84,root:50,wave:'sine',seed:13},madinah:{bpm:90,root:52,wave:'triangle',seed:14},jawf:{bpm:98,root:50,wave:'sine',seed:11},rub:{bpm:86,root:45,wave:'sawtooth',seed:12},
  neon:{bpm:124,root:50,wave:'square',seed:9}
};
Object.keys(MUS).forEach(k=>{
  const m=MUS[k];let idx=3;m.ph=[];
  for(let s=0;s<32;s++){
    idx=clamp(idx+(hash(s*1.7+m.seed*13)<.5?-1:1)*(hash(s*5.3+m.seed)<.3?2:1),0,7);
    m.ph.push(hash(s*3.1+m.seed*7)<(s%2?.5:.2)?-1:idx);
  }
  m.ph[30]=0;
});
const mf=n=>440*Math.pow(2,(n-69)/12);
function setMusic(th){if(th!==musTheme){musTheme=th;musStep=0;if(AC)musNext=AC.currentTime+.1;}}
function musTick(){
  if(!AC||!musTheme||!MUS[musTheme])return;
  const m=MUS[musTheme], sd=60/m.bpm/2;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.3){
    const d=musNext-AC.currentTime, s=musStep%32, n=m.ph[s];
    if(n>=0){const nt=m.root+12+HIJAZ[n];tone(mf(nt),mf(nt),sd*1.6,m.wave,.5,d,musGain);}
    if(s%4===0){const b=m.root-12+((s%16===8)?7:0);tone(mf(b),mf(b),sd*3.4,'sine',.9,d,musGain);}
    if(s%8===0)tone(130,55,.14,'sine',1,d,musGain);
    if(s%8===4||s%8===6)tone(2400,1200,.03,'square',.22,d,musGain);
    musNext+=sd;musStep++;
  }
}
/* أجواء المراحل (موج، رياح) */
const AMB_CFG={jeddah:['lowpass',420,.07,.06,.17],abha:['bandpass',700,.05,.04,.08],dunes:['bandpass',500,.035,.03,.1],
  qassim:['bandpass',500,.035,.03,.1],north:['bandpass',450,.045,.035,.09],menu:['bandpass',500,.03,.02,.1],tabuk:['bandpass',600,.04,.03,.09],makkah:['bandpass',450,.03,.02,.08],madinah:['lowpass',700,.03,.02,.09],jawf:['lowpass',800,.03,.02,.1],rub:['bandpass',380,.06,.05,.07],ahsa:['lowpass',900,.02,.015,.12]};
function setAmb(theme){
  ambTheme=theme;if(!AC)return;
  if(!amb){
    const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;
    const f=AC.createBiquadFilter(),g=AC.createGain();g.gain.value=0;

function gen(name,theme,seed,nseg,o){
  let ri=0;const rnd=()=>hash(seed*97.13+(ri++)*13.7);
  const D={name:name,theme:theme,spawn:2,ground:[],ledges:[],blocks:[],boxes:[],coins:[],enemies:[],spikes:[],decor:[],checks:[]};
  const ET=o.enemies,DT=o.decor,air=o.air==null?.6:o.air,pickE=()=>ET[Math.floor(rnd()*ET.length)];
  const en=(k,c,a,b)=>D.enemies.push([k,c,a,Math.max(b,a+2)]);
  let x=0,prev=-1;
  for(let s=0;s<nseg;s++){
    const first=s===0,last=s===nseg-1;
    const n=first?24:(last?22:20+Math.floor(rnd()*9));
    const a=x,b=x+n-1;D.ground.push([a,b]);
    if(first){
      D.boxes.push([a+8,8,'coin'],[a+9,8,'coffee'],[a+10,8,'coin']);
      D.coins.push(['l',a+4,10,3],['l',a+13,10,4],['l',a+18,9,4]);
    }else if(last){
      D.goal=a+12;D.cols=b+1;D.coins.push(['l',a+3,10,6]);D.boxes.push([a+6,8,'heart']);
    }else{
      let kind=Math.floor(rnd()*5);if(kind===prev)kind=(kind+1)%5;prev=kind;
      if(kind===0){
        en(pickE(),a+3,a+3,a+8);D.spikes.push([a+10,2]);en(pickE(),a+13,a+13,b-3);
        D.coins.push(['a',a+9,11,4],['l',a+14,10,3]);
        if(rnd()<air)en('b',a+6,a+4,a+16);
      }else if(kind===1){
        const c=a+Math.floor(n/2)-1;
        D.blocks.push([c,11,1,1],[c+1,10,1,2],[c+2,9,1,3]);
        D.coins.push(['l',c,7,3],['l',a+3,10,3]);
        en(pickE(),a+3,a+3,c-2);en(pickE(),c+4,c+4,b-2);
        if(rnd()<air)en('b',c-6,c-8,c+8);
      }else if(kind===2){
        D.boxes.push([a+4,8,'coin'],[a+5,8,(s%2?'heart':'coffee')],[a+6,8,'coin'],[a+14,8,'coin'],[a+15,8,'coin']);
        en(pickE(),a+4,a+4,a+14);en(pickE(),a+16,a+16,b-2);
        D.coins.push(['l',a+9,10,3]);
        if(rnd()<air)en('b',a+8,a+7,b-2);
      }else if(kind===3){
        D.ledges.push([a+5,9,3],[a+10,8,3],[a+15,9,3]);
        D.coins.push(['l',a+5,8,3],['l',a+10,7,3],['l',a+15,8,3]);
        en(pickE(),a+3,a+3,b-3);
        if(rnd()<air)en('b',a+12,a+10,b-1);
      }else{
        D.spikes.push([a+9,2],[a+16,2]);
        D.coins.push(['a',a+8,11,4],['a',a+15,11,4]);
        D.boxes.push([a+3,8,'coin'],[a+4,8,(s%2?'coffee':'heart')],[a+5,8,'coin']);
        en('b',a+3,a+2,b-2);
      }
      if(s%2===0)D.checks.push(a+2);
    }
    if(!last){
      const g=b+1,gw=(o.wide&&rnd()<o.wide)?4:3;
      D.ledges.push([g+1,10,2]);D.coins.push(['a',g-1,11,gw+2]);x=b+1+gw;
    }else x=b+1;
    const nd=2+Math.floor(rnd()*2);
    for(let k=0;k<nd;k++){
      const span=last?8:n-3, col=a+1+Math.floor(rnd()*span);
      D.decor.push([DT[Math.floor(rnd()*DT.length)],col,.9+rnd()*.4]);
    }
  }
  return D;
}

function extend(B,nseg,seed){
  const g=gen(B.name,B.theme,seed,nseg,EXT[B.theme]);
  let E=0;B.ground.forEach(([a,b])=>{if(b>E)E=b;});
  const s=E+5,add=k=>(B[k]||[]).slice();
  const D={name:B.name,theme:B.theme,spawn:B.spawn};
  D.ground=add('ground').concat(g.ground.map(([a,b])=>[a+s,b+s]));
  D.ledges=add('ledges').concat([[E+2,10,2]],g.ledges.map(([c,r,w])=>[c+s,r,w]));
  D.blocks=add('blocks').concat(g.blocks.map(([c,r,w,h])=>[c+s,r,w,h]));
  D.boxes=add('boxes').concat(g.boxes.map(([c,r,t])=>[c+s,r,t]));
  D.movers=add('movers');
  D.coins=add('coins').concat([['a',E,11,6]],g.coins.map(([k,c,r,n])=>[k,c+s,r,n]));
  D.enemies=add('enemies').concat(g.enemies.map(([k,c,a,b])=>[k,c+s,a+s,b+s]));
  D.spikes=g.spikes.map(([c,w])=>[c+s,w]);
  D.decor=add('decor').concat(g.decor.map(d=>{const r=d.slice();r[1]+=s;return r;}));
  D.checks=add('checks').concat([s+2],g.checks.map(c=>c+s));
  D.goal=g.goal+s;D.cols=g.cols+s;
  return D;
}

const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyX:'fire',KeyJ:'fire',KeyK:'fire',ShiftLeft:'fire',ShiftRight:'fire'};
function recompute(){keys.left=kb.left||tc.left;keys.right=kb.right||tc.right;keys.jump=kb.jump||tc.jump;keys.fire=kb.fire||tc.fire;}
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Enter'&&ovShown&&ovFn){e.preventDefault();initAudio();SFX.click();ovFn();}return;}
  const k=KEYMAP[e.code];
  if(ovShown&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();initAudio();if(ovFn){SFX.click();ovFn();}return;}
  if(k){e.preventDefault();initAudio();kb[k]=true;recompute();}
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(e.code==='KeyM')toggleMute();
  if(e.code==='KeyF')toggleFS();
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){kb[k]=false;recompute();}});
window.addEventListener('blur',()=>{kb.left=kb.right=kb.jump=kb.fire=false;tc.left=tc.right=tc.jump=tc.fire=false;recompute();});
const tbtns=Array.prototype.slice.call(document.querySelectorAll('.tb'));
function showTouch(){$('touch').classList.add('show');document.body.classList.add('touch');}
if('ontouchstart' in window||(navigator.maxTouchPoints||0)>0)showTouch();
function syncTouch(e){
  const st={left:false,right:false,jump:false,fire:false};
  const list=e.touches?Array.prototype.slice.call(e.touches):[];
  for(const t of list){
    const el=document.elementFromPoint(t.clientX,t.clientY), b=el&&el.closest?el.closest('.tb'):null;
    if(b)st[b.dataset.k]=true;
  }
  tbtns.forEach(b=>b.classList.toggle('on',!!st[b.dataset.k]));
  tc.left=st.left;tc.right=st.right;tc.jump=st.jump;tc.fire=st.fire;recompute();
}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>document.addEventListener(n,e=>{
  if(n==='touchstart'){showTouch();initAudio();}
  const tg=e.target,inCtl=tg&&tg.closest&&tg.closest('#touch');
  const inBtn=tg&&tg.closest&&tg.closest('#hud button,#overlay button');
  if(inCtl||(G.state==='play'&&!inBtn))e.preventDefault();
  syncTouch(e);
},{passive:false}));
tbtns.forEach(b=>{
  b.addEventListener('mousedown',()=>{initAudio();tc[b.dataset.k]=true;b.classList.add('on');recompute();});
  const up=()=>{tc[b.dataset.k]=false;b.classList.remove('on');recompute();};
  b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up);
});

function collectItem(it){

function updatePlayer(){
  const L=G.L;
  if(P.dying){P.vy=Math.min(P.vy+.5,14);P.y+=P.vy;P.dt--;if(P.dt<=0)afterDeath();return;}
  // منصات متحركة
  for(const m of L.movers){m.t+=m.sp;const nx=m.bx+Math.sin(m.t)*m.ax,ny=m.by+Math.sin(m.t*.8+1)*m.ay;m.dx=nx-m.x;m.dy=ny-m.y;m.x=nx;m.y=ny;}
  if(P.ride){P.x+=P.ride.dx;P.y+=P.ride.dy;}
  const maxV=P.power>0?6.3:4.4;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const acc=P.on?.55:.4;
  if(dir){P.vx+=dir*acc*((P.vx!==0&&Math.sign(P.vx)!==dir)?1.8:1);P.face=dir;}
  else{const f=P.on?.5:.12;if(Math.abs(P.vx)<=f)P.vx=0;else P.vx-=Math.sign(P.vx)*f;}
  P.vx=clamp(P.vx,-maxV,maxV);
  // القفز
  if(keys.jump&&!prevJump)P.jb=8;
  prevJump=keys.jump;if(P.jb>0)P.jb--;
  if(P.on){P.coy=7;P.dj=1;P.air=0;}else{if(P.coy>0)P.coy--;P.air++;}
  if(P.jb>0&&P.coy>0){P.vy=P.power>0?-13:-12.4;P.on=false;P.coy=0;P.jb=0;P.ride=null;SFX.jump();burst(P.x+P.w/2,P.y+P.h,'#e6c89a',5,1.5);}
  else if(P.jb>0&&P.dj>0&&P.air>9&&P.coy===0){P.dj=0;P.jb=0;P.vy=P.power>0?-12:-11.2;SFX.djump();addP(P.x+P.w/2,P.y+P.h,0,0,18,'#bfe8ff',6,0,4);burst(P.x+P.w/2,P.y+P.h,'#d8f2ff',9,2.5);}
  if(!keys.jump&&P.vy<-5.5)P.vy=-5.5;
  if(P.fcd>0)P.fcd--;
  if(keys.fire&&P.fcd<=0&&(P.ammo>0||P.power>0))shoot();
  P.vy=Math.min(P.vy+.55,14);
  // حركة أفقية
  P.x+=P.vx;
  for(const s of L.solids){
    if(overlap(P,s)){
      if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;
      P.vx=0;
    }
  }
  if(P.x<0){P.x=0;P.vx=0;}
  if(P.x>L.width-P.w){P.x=L.width-P.w;P.vx=0;}
  // حركة رأسية
  const wasOn=P.on, prevB=P.y+P.h; P.pb=prevB;
  let lv=0;
  P.y+=P.vy;P.on=false;P.ride=null;
  for(const s of L.solids){
    if(overlap(P,s)){
      if(P.vy>0){lv=P.vy;P.y=s.y-P.h;P.on=true;P.vy=0;}
      else if(P.vy<0){P.y=s.y+s.h;P.vy=0;if(s.kind==='box')hitBox(s);}
    }
  }
  for(const s of L.oneways){
    if(P.vy>=0&&overlap(P,s)&&prevB<=s.y+6+Math.max(0,s.dy||0)){
      lv=Math.max(lv,P.vy);P.y=s.y-P.h;P.on=true;P.vy=0;if(s.kind==='mover')P.ride=s;
    }
  }
  if(P.on&&!wasOn){if(lv>5)SFX.land();if(Math.abs(P.vx)>0.5||lv>5)burst(P.x+P.w/2,P.y+P.h,'#e6c89a',4,1.2);if(lv>9){addP(P.x+P.w/2,P.y+P.h,0,0,16,'rgba(235,205,150,.9)',4,0,4);G.shake=Math.max(G.shake,3);}}
  if(P.on)P.chain=0;
  if(P.on&&Math.abs(P.vx)>3.5&&Math.random()<.3)addP(P.x+P.w/2-P.face*8,P.y+P.h-2,-P.face*.6,-.4,18,'rgba(230,200,150,.7)',3,-.01);
  P.runT+=Math.abs(P.vx)*.14;
  if(P.on&&Math.abs(P.vx)>1.2){const n=Math.floor(P.runT/Math.PI);if(n!==P.ls){P.ls=n;SFX.step();}}
  if(P.inv>0)P.inv--;
  if(P.power>0){
    P.power--;if(Math.abs(P.vx)>2&&P.power%2===0)addP(P.x+P.w/2-P.face*12,P.y+P.h*.6,-P.face*1.5,(Math.random()-.5),22,'rgba(255,190,50,.85)',4.5,-.02);
    if(P.power%6===0)addP(P.x+P.w/2+(Math.random()-.5)*26,P.y+P.h-10,0,-1,26,'#ffd54f',2.5,-.02);
    if(P.power>0&&P.power<150&&P.power%25===0)SFX.tick();
    if(P.power===0)updateHUD();else if(P.power%60===0)updateHUD();
  }
  if(G.comboT>0)G.comboT--;
  if(P.y>H+80)loseLife(true);
  // نقاط الحفظ
  for(const c of L.checks){if(!c.on&&P.x>c.x){c.on=true;L.cp=c.x;SFX.check();popText(c.x,GR*T-90,'نقطة حفظ');burst(c.x+T/2,GR*T-60,'#ffcf5a',12,2.5);}}
  // العملات (التمور)
  const pc={x:P.x+P.w/2,y:P.y+P.h/2};
  for(const c of L.coins){
    if(c.got)continue;
    const dx=c.x-pc.x,dy=c.y-pc.y;
    if(dx*dx+dy*dy<36*36){
      c.got=true;addScore(10);if(++G.cc%8===0&&P.ammo<12){P.ammo++;popText(c.x,c.y-30,'+١ 🌰');updateHUD();}
      G.combo=G.comboT>0?G.combo+1:1;G.comboT=40;
      SFX.coin(G.combo);burst(c.x,c.y,'#ffd54f',6,2);popText(c.x,c.y-10,'+١٠');
    }
  }
  // العناصر
  for(const it of L.items){
    if(it.got)continue;
    if(it.y>it.ty)it.y-=1.6;
    it.ph+=.1;
    if(overlap(P,{x:it.x,y:it.y,w:it.w,h:it.h}))collectItem(it);
  }
  // الأشواك
  for(const sp of L.spikes){
    if(P.inv<=0&&P.power<=0&&overlap(P,{x:sp.x+6,y:sp.y+8,w:sp.w-12,h:sp.h-8})){loseLife(false);return;}
  }
  // الأعداء
  for(const e of L.enemies){
    if(!e.alive)continue;
    const hb={x:e.x+4,y:e.y+3,w:e.w-8,h:e.h-3};
    if(!overlap(P,hb))continue;
    if(P.power>0){killEnemy(e,false);}
    else if(P.vy>0&&P.pb<=e.y+16){P.chain++;killEnemy(e,true,[100,200,400,800][Math.min(3,P.chain-1)]);P.vy=keys.jump?-11.5:-8.5;P.dj=1;P.air=0;}
    else if(P.inv<=0){loseLife(false);return;}
  }
  // الوصول لخيمة الضيافة
  const g=L.goal;
  if(overlap(P,{x:g.x+45,y:g.y+20,w:g.w-90,h:g.h-20}))finishLevel();
}
function shoot(){
  if(P.power<=0)P.ammo--;
  P.fcd=P.power>0?9:20;
  G.shots.push({x:P.x+P.w/2+P.face*18,y:P.y+P.h*.42,vx:P.face*10+P.vx*.3,vy:-1.2,life:80,rot:0});
  SFX.shoot();burst(P.x+P.w/2+P.face*22,P.y+P.h*.42,'#ffd54f',5,2);updateHUD();
}
function killEnemy(e,stomp,pts){
  pts=pts||100;
  e.alive=false;e.sq=30;addScore(pts);if(stomp)SFX.stomp();else SFX.zap();
  burst(e.x+e.w/2,e.y+e.h/2,'#e0b070',16,3.5);burst(e.x+e.w/2,e.y+e.h/2,'#fff3b0',8,5,1);

function updateWorld(){
  const L=G.L;
  for(const e of L.enemies){
    if(!e.alive){if(e.sq>0)e.sq--;if(e.k==='b')e.y+=4;continue;}
    e.x+=e.dir*e.sp;
    if(e.x<e.min){e.x=e.min;e.dir=1;}
    if(e.x+e.w>e.max){e.x=e.max-e.w;e.dir=-1;}
    if(e.k==='b'){
      const near=Math.abs((P.x+P.w/2)-(e.x+e.w/2))<300&&!P.dying;
      const ty=near?clamp(P.y+P.h*.3,e.by-10,GR*T-e.h-8):e.by;
      e.y+=(ty-e.y)*(near?.035:.025)+Math.sin(G.time*5+e.ph)*.7;
    }
    if(e.k==='d'&&Math.random()<.08)addP(e.x+e.w/2+(Math.random()-.5)*30,e.y+e.h-4,-e.dir*.5,-.5,20,'rgba(220,170,100,.7)',2.5,.02);
  }
  for(const b of L.boxes)if(b.bump>0)b.bump=Math.max(0,b.bump-.08);
  for(const sh of G.shots){
    sh.x+=sh.vx;sh.y+=sh.vy;sh.vy+=.06;sh.life--;sh.rot+=.4;
    if(Math.random()<.8)addP(sh.x,sh.y,-sh.vx*.1,0,16,'#ffb300',3,0);
    for(const r of L.solids){if(sh.x>=r.x&&sh.x<=r.x+r.w&&sh.y>=r.y&&sh.y<=r.y+r.h){sh.life=0;burst(sh.x,sh.y,'#ffd54f',6,2);break;}}
    if(sh.life<=0)continue;
    for(const e of L.enemies){
      if(e.alive&&sh.x>e.x-4&&sh.x<e.x+e.w+4&&sh.y>e.y-2&&sh.y<e.y+e.h+4){killEnemy(e,false);sh.life=0;break;}
    }
  }
  G.shots=G.shots.filter(sh=>sh.life>0);
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=.8;t.life--;}
  G.texts=G.texts.filter(t=>t.life>0);
  if(G.shake>0)G.shake*=.85;
}
function updateCam(snap){
  const L=G.L;
  const target=clamp(P.x+P.w/2-W*.42+P.face*30,0,Math.max(0,L.width-W));
  if(P.dying&&P.y>H)return;
  G.cam+=(target-G.cam)*(snap?1:.1);
}
function step(){
  G.time+=1/60;if(G.flash>0)G.flash*=.88;
  const s=G.state;
  if(s==='menu'){
    G.cam+=1.5;if(G.cam>G.L.width-W-20)G.cam=0;
    P.x=G.cam+250;P.y=GR*T-P.h;P.vx=3.4;P.face=1;P.on=true;P.runT+=.48;
    for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}
    G.parts=G.parts.filter(p=>p.life>0);
    if(Math.random()<.4)addP(P.x+P.w/2-10,P.y+P.h-2,-1.2,-.4,18,'rgba(230,200,150,.7)',3,-.01);
    return;
  }
  if(s==='play'){
    if(G.freeze>0){G.freeze--;updateCam(false);return;}
    updatePlayer();updateWorld();updateCam(false);
    if(G.banner>0)G.banner--;
  }else if(s==='clearing'){
    P.on=true;P.vx=P.face*1.5;P.x+=P.vx;P.runT+=.2;
    updateWorld();G.ct--;if(G.ct<=0)afterClear();
  }else if(s==='clear'||s==='over'){
    updateWorld();
  }
}

function frond(c,tx,ty,ang,len,s){
  const ex=tx+Math.cos(ang)*len, ey=ty+Math.sin(ang)*len*.7+len*.38;
  const mx=tx+Math.cos(ang)*len*.55, my=ty+Math.sin(ang)*len*.7-8*s;

  c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(mx+nx*8*s,my+ny*8*s,ex,ey);c.quadraticCurveTo(mx-nx*8*s,my-ny*8*s,tx,ty);c.fill();
}
function drawPalm(c,x,gy,s,t,col){

    sign(c,cx,y-158,'مجلس الضيافة');

    c.fillStyle='#00e5ff';c.font='700 16px '+FONT;c.textAlign='center';c.direction='rtl';c.fillText('خيمة الضيافة',cx,y-134);
  }

/* ---- سوبر عزام ---- */
function arm(c,sx,sy,ang){
  const ex=sx+Math.sin(ang)*12,ey=sy+Math.cos(ang)*12;
  c.lineCap='round';c.strokeStyle='#c9d3db';c.lineWidth=8;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();
  c.strokeStyle='#fff';c.lineWidth=6;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();
  c.fillStyle='#e0a066';c.beginPath();c.arc(ex+Math.sin(ang)*3,ey+Math.cos(ang)*3,3.4,0,7);c.fill();
}
function leg(c,x,y){
  c.fillStyle='#d4955a';c.fillRect(x-2.6,-14,5.2,Math.max(2,y+9));
  c.fillStyle='#fff';rr(c,x-5,y-7,13,7,3);c.fill();
  c.fillStyle='#0e8a45';c.fillRect(x-5,y-2,13,2);
  c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1;rr(c,x-5,y-7,13,7,3);c.stroke();
}
function drawPlayer(c){
  const p=P,t=G.time;
  if(p.inv>0&&!p.dying&&((t*16)|0)%2===0)return;
  if(!SHEM_PAT)SHEM_PAT=c.createPattern(SHEM,'repeat');
  c.save();
  c.translate(p.x+p.w/2,p.y+p.h);
  c.scale(PS,PS);
  if(p.dying){c.translate(0,-22);c.rotate(Math.sin(p.dt*.25)*.5);c.translate(0,22);}
  if(p.power>0&&!(p.power<120&&((t*10)|0)%2===0)){
    const gr=c.createRadialGradient(0,-26,4,0,-26,42);gr.addColorStop(0,'rgba(255,230,120,.5)');gr.addColorStop(1,'rgba(255,200,60,0)');
    c.fillStyle=gr;c.beginPath();c.arc(0,-26,42,0,7);c.fill();
    c.strokeStyle='rgba(255,215,90,.85)';c.lineWidth=2;c.beginPath();c.arc(0,-26,33+Math.sin(t*8)*2,0,7);c.stroke();
    for(let i=0;i<4;i++){const a=t*3+i*1.57;c.fillStyle='#fff3b0';c.beginPath();c.arc(Math.cos(a)*34,-26+Math.sin(a)*34,2.2,0,7);c.fill();}
    if(Math.abs(p.vx)>5){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-p.face*(20+i*6),-10-i*12);c.lineTo(-p.face*(44+i*6),-10-i*12);c.stroke();}}
  }
  c.scale(p.face,1);
  const sp=Math.abs(p.vx),air=!p.on,ph=p.runT,k=Math.min(1,sp/2.5),rise=p.vy<0;
  const sw=air?0:Math.sin(ph)*k, bob=air?0:Math.abs(Math.cos(ph))*2*k;
  const ffx=air?7:4+sw*8, ffy=air?(rise?-5:-1):-Math.max(0,Math.cos(ph))*4*k;
  const bfx=air?-5:-4-sw*8, bfy=air?(rise?-9:-3):-Math.max(0,-Math.cos(ph))*4*k;
  leg(c,bfx,bfy);leg(c,ffx,ffy);
  c.save();c.translate(0,-bob);
  const flap=Math.min(9,sp*1.5)+(air&&rise?2:0);
  const fl=Math.min(8,sp*1.4)+(air?(rise?3:-1):0), fy=Math.sin(t*9)*1.5;
  c.fillStyle=SHEM_PAT;c.strokeStyle='#8b0d20';c.lineWidth=1;
  c.beginPath();c.moveTo(-10,-50);c.quadraticCurveTo(-18-fl,-44,-17-fl*1.4,-27+fy);c.lineTo(-8,-29);c.quadraticCurveTo(-8,-38,-6,-46);c.closePath();c.fill();c.stroke();
  arm(c,-6,-29,air?(rise?-2.7:-1.5):-sw*1.0);
  const hemY=-9-Math.min(5,sp*.8);
  c.beginPath();c.moveTo(-9,-31);c.quadraticCurveTo(0,-34,9,-31);c.lineTo(12,-10);
  c.quadraticCurveTo(0,-5+Math.sin(t*10)*1.2,-12-flap,hemY);c.lineTo(-9,-31);c.closePath();
  const tg=c.createLinearGradient(-12,0,12,0);tg.addColorStop(0,'#e3ebf0');tg.addColorStop(.5,'#ffffff');tg.addColorStop(1,'#dfe7ec');
  c.fillStyle=tg;c.fill();
  c.save();c.clip();
  c.fillStyle='#0a8f48';c.fillRect(-16,-22,34,3.2);
  c.fillStyle='#e8c04a';c.fillRect(-16,-18.5,34,1.2);
  c.fillStyle='rgba(0,0,0,.08)';c.fillRect(-14,-31,4,30);
  c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;c.beginPath();c.moveTo(1,-30);c.lineTo(1,-8);c.stroke();
  c.fillStyle='#0a8f48';for(let i=0;i<3;i++){c.beginPath();c.arc(1,-28+i*4.5,1,0,7);c.fill();}
  c.restore();
  c.strokeStyle='#b7c2cc';c.lineWidth=1;c.stroke();
  c.fillStyle='#d9a066';c.beginPath();c.moveTo(-3.5,-31);c.lineTo(3.5,-31);c.lineTo(0,-26);c.closePath();c.fill();
  const hx=1,hy=-41;
  const hg=c.createRadialGradient(hx+2,hy-2,2,hx,hy,12);hg.addColorStop(0,'#f6c28a');hg.addColorStop(1,'#d08e52');
  c.fillStyle='#c9854a';c.beginPath();c.arc(hx-10.5,hy+1,3,0,7);c.fill();
  c.fillStyle=hg;c.beginPath();c.arc(hx,hy,11,0,7);c.fill();
  const blink=((t*.8)%3.2)<.1,ey=blink?.4:2.8;
  c.fillStyle='#1b1209';c.beginPath();c.ellipse(hx-1.5,hy+1,2.1,ey,0,0,7);c.fill();c.beginPath();c.ellipse(hx+6,hy+1,2.1,ey,0,0,7);c.fill();
  if(!blink){c.fillStyle='#fff';c.beginPath();c.arc(hx-.8,hy-.2,.8,0,7);c.fill();c.beginPath();c.arc(hx+6.7,hy-.2,.8,0,7);c.fill();}
  c.strokeStyle='#3b2314';c.lineWidth=1.8;c.lineCap='round';c.beginPath();c.moveTo(hx-4.5,hy-3.5);c.lineTo(hx+.5,hy-4.2);c.moveTo(hx+3.8,hy-4.2);c.lineTo(hx+9,hy-3.4);c.stroke();
  c.fillStyle='rgba(255,110,110,.35)';c.beginPath();c.arc(hx-4,hy+6,2.4,0,7);c.fill();c.beginPath();c.arc(hx+8,hy+6,2.2,0,7);c.fill();
  c.strokeStyle='#8a4a22';c.lineWidth=1.4;
  if(air){c.fillStyle='#7a1e1e';c.beginPath();c.ellipse(hx+3,hy+6.5,2.6,2.2,0,0,7);c.fill();}
  else{c.beginPath();c.arc(hx+3,hy+4.8,3.2,.15*Math.PI,.85*Math.PI);c.stroke();}
  c.fillStyle=SHEM_PAT;c.strokeStyle='#8b0d20';c.lineWidth=1;
  c.beginPath();c.moveTo(-12.5,-40);c.bezierCurveTo(-13.5,-57,14.5,-57,13.5,-40);
  c.quadraticCurveTo(12,-44.5,5,-46);c.quadraticCurveTo(0,-47.5,-6,-46);c.quadraticCurveTo(-11,-44.5,-12.5,-40);c.closePath();c.fill();c.stroke();
  c.strokeStyle='#161616';c.lineWidth=2.6;c.lineCap='round';
  c.beginPath();c.moveTo(-12.4,-48.5);c.quadraticCurveTo(0,-43,12.6,-48.5);c.stroke();
  c.beginPath();c.moveTo(-12.6,-52);c.quadraticCurveTo(0,-46.5,12.8,-52);c.stroke();
  arm(c,6,-29,air?(rise?-2.3:-1.1):sw*1.0);
  c.restore();
  c.restore();
}

/* ---- العرض الرئيسي ---- */
function render(){
  const c=ctx;c.setTransform(RS,0,0,RS,0,0);
  const L=G.L;if(!L)return;
  const t=G.time,cam=G.cam;
  drawBackground(c,L,cam,t);
  c.save();
  const sh=G.shake>.5?(Math.random()-.5)*G.shake:0;
  c.translate(-Math.round(cam)+sh,0);
  drawDecor(c,L,cam,t);
  drawGround(c,L,cam,t);
  drawBlocks(c,L,cam);
  drawLedges(c,L,cam,t);
  for(const b of L.boxes)if(b.x>cam-60&&b.x<cam+W+60)drawBox(c,b,L.theme,t);
  drawGoal(c,L,t);
  for(const sp of L.spikes)if(sp.x>cam-100&&sp.x<cam+W+100)drawSpikes(c,sp,L.theme,t);
  for(const k of L.coins)if(!k.got&&k.x>cam-30&&k.x<cam+W+30)drawDate(c,k.x,k.y,t,k.ph);
  for(const it of L.items){if(it.got)continue;if(it.type==='coffee')drawFinjan(c,it.x+16,it.y+22+Math.sin(it.ph)*2,1.2,t);else drawHeart(c,it.x+16,it.y+20,1.1,t);}
  const neon=L.theme==='neon';
  for(const e of L.enemies){
    if(e.x<cam-80||e.x>cam+W+80)continue;
    if(!e.alive&&e.sq<=0)continue;
    if(e.k==='s')drawScorpion(c,e,neon,t);
    else if(e.k==='d')drawDune(c,e,neon,t);
    else if(e.k==='c')drawCrab(c,e,neon,t);
    else if(e.k==='b')drawFlyer(c,e,L.theme,neon,t);
    else drawRock(c,e,neon,t);
  }
  if(P.on&&!P.dying&&G.state!=='menu'){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(P.x+P.w/2,P.y+P.h+1,15,4,0,0,7);c.fill();}
  if(G.state!=='clearing'||G.ct>20)drawPlayer(c);
  for(const sh of G.shots){
    const g=c.createRadialGradient(sh.x,sh.y,1,sh.x,sh.y,20);g.addColorStop(0,'rgba(255,230,120,.85)');g.addColorStop(1,'rgba(255,160,40,0)');
    c.fillStyle=g;c.beginPath();c.arc(sh.x,sh.y,20,0,7);c.fill();
    c.save();c.translate(sh.x,sh.y);c.rotate(sh.rot);c.fillStyle='#ffb300';c.beginPath();c.ellipse(0,0,8,5,0,0,7);c.fill();
    c.strokeStyle='#7a4a00';c.lineWidth=1.2;c.stroke();c.fillStyle='rgba(255,255,255,.7)';c.fillRect(-4,-2,4,1.5);c.restore();
  }
  for(const p of G.parts){
    const a=clamp(p.life/p.max,0,1);
    if(p.shape===2){drawDate(c,p.x,p.y,t,0);continue;}
    if(p.shape===4){c.globalAlpha=a*.85;c.strokeStyle=p.col;c.lineWidth=1+2.5*a;c.beginPath();c.arc(p.x,p.y,p.size+(1-a)*28,0,7);c.stroke();c.globalAlpha=1;continue;}
    c.globalAlpha=a;c.fillStyle=p.col;
    if(p.shape===1||p.shape===3){c.save();c.translate(p.x,p.y);c.rotate(p.rot+p.life*.2);c.fillRect(-p.size/2,-p.size/2,p.size,p.size*(p.shape===3?.5:1));c.restore();}
    else{c.beginPath();c.arc(p.x,p.y,p.size*(.4+a*.6),0,7);c.fill();}
    c.globalAlpha=1;
  }
  c.font='800 20px '+FONT;c.textAlign='center';c.direction='rtl';c.lineJoin='round';
  for(const tx of G.texts){
    c.globalAlpha=clamp(tx.life/25,0,1);c.lineWidth=4;c.strokeStyle='rgba(60,20,0,.85)';c.strokeText(tx.s,tx.x,tx.y);
    c.fillStyle='#ffe27a';c.fillText(tx.s,tx.x,tx.y);c.globalAlpha=1;
  }
  c.restore();
  drawForeground(c,L,cam,t);drawRays(c,L,t);drawAmbient(c,L,cam,t);
  const vg=c.createRadialGradient(W/2,H/2,H*.55,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
  if(G.flash>.02){c.fillStyle='rgba('+G.fcol+','+Math.min(.6,G.flash)+')';c.fillRect(0,0,W,H);}
  if(G.state==='play'&&G.banner>0){
    const a=clamp(Math.min(G.banner/40,(200-G.banner)/25),0,1);
    c.globalAlpha=a;c.textAlign='center';c.direction='rtl';c.lineJoin='round';
    c.font='800 44px '+FONT;c.lineWidth=7;c.strokeStyle='rgba(30,10,0,.8)';
    const s1='المرحلة '+nf(G.level);c.strokeText(s1,W/2,150);c.fillStyle='#ffd24a';c.fillText(s1,W/2,150);
    c.font='700 28px '+FONT;c.lineWidth=5;c.strokeText(L.name,W/2,192);c.fillStyle='#fff';c.fillText(L.name,W/2,192);
    c.globalAlpha=1;
  }
}

/* ---------------- الحلقة الرئيسية ---------------- */
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  const dt=Math.min(100,ts-last);last=ts;
  if(G.state!=='paused'){
    acc+=dt;
    while(acc>=1000/60){step();acc-=1000/60;}
  }else acc=0;
  render();
}
resize();
showMenu();
updateHUD();
requestAnimationFrame(frame);
})();
</script>
